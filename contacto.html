<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Janela com Ferrugem</title>
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jcf-globals.css">
  <style>
    /* =======================================================================
       CONTACTO — Layout principal
       Elementor: Container > Direction: Column > Min Height: 100vh > Max Width: 1440px
       ======================================================================= */
    .jcf-contacto-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: var(--jcf-container-max);
      margin: 0 auto;
      position: relative;
    }

    /* =======================================================================
       CONTACTO MAIN — Grid 12 colunas
       Col 1: Sidebar label "CONTACTO"
       Cols 4–6: Texto e dados de contacto
       Cols 7–10: Formulário
       ======================================================================= */
    .jcf-contacto-main {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 24px;
      width: 100%;
      padding: 100px 60px 60px;
      align-items: flex-start;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .jcf-contacto-sidebar {
      grid-column: 1;
      padding-top: 4px;
    }

    /* =======================================================================
       CONTACTO INFO
       ======================================================================= */
    .jcf-contacto-info {
      grid-column: 4 / 7;
      display: flex;
      flex-direction: column;
    }

    .jcf-contacto-info__intro {
      font-size: var(--jcf-fs-subtitle);
      color: var(--e-global-color-secondary);
      line-height: var(--jcf-lh-contact);
      margin-bottom: 40px;
    }

    .jcf-contacto-info__details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .jcf-contacto-info__detail {
      font-size: var(--jcf-fs-body);
      color: var(--e-global-color-secondary);
      line-height: var(--jcf-lh-contact);
    }

    .jcf-contacto-info__detail--link {
      transition: opacity 0.3s ease;
    }

    .jcf-contacto-info__detail--link:hover {
      opacity: 0.6;
    }


    /* WhatsApp CTA */
    .jcf-contacto-info__cta {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      font-family: var(--e-global-typography-primary-font-family);
      font-weight: var(--jcf-font-light);
      font-size: var(--jcf-fs-section-title);
      letter-spacing: var(--jcf-ls-section-title);
      text-transform: uppercase;
      color: var(--e-global-color-secondary);
      white-space: nowrap;
      padding: 6px 10px;
      margin-left: -10px;
      border-radius: 2px;
      transition: background-color 0.2s ease;
    }
    .jcf-contacto-info__cta:hover {
      background-color: var(--e-global-color-accent);
    }
    .jcf-contacto-info__cta svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* =======================================================================
       FORMULÁRIO DE CONTACTO
       ======================================================================= */
    .jcf-contacto-form {
      grid-column: 7 / 11;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .jcf-form-field {
      display: flex;
      flex-direction: column;
    }

    .jcf-form-field__input,
    .jcf-form-field__textarea {
      font-size: var(--jcf-fs-body);
      color: var(--e-global-color-primary);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--jcf-color-border);
      padding: 8px 0 10px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s ease;
    }

    .jcf-form-field__input::placeholder,
    .jcf-form-field__textarea::placeholder {
      color: var(--e-global-color-secondary);
    }

    .jcf-form-field__input:focus,
    .jcf-form-field__textarea:focus {
      border-bottom-color: var(--e-global-color-primary);
    }

    .jcf-form-field__textarea {
      resize: none;
      min-height: 100px;
      line-height: var(--jcf-lh-body);
    }

    /* Botão Enviar — sem fundo por defeito, bege no hover (igual aos links do menu) */
    .jcf-form-submit {
      font-family: var(--e-global-typography-primary-font-family);
      font-weight: var(--jcf-font-light);
      font-size: var(--jcf-fs-section-title);
      letter-spacing: var(--jcf-ls-section-title);
      text-transform: uppercase;
      color: var(--e-global-color-primary);
      background-color: transparent;
      border: none;
      padding: 6px 10px;
      margin-left: -10px;
      margin-top: 32px;
      cursor: pointer;
      border-radius: 2px;
      align-self: flex-start;
      transition: background-color 0.2s ease;
    }

    .jcf-form-submit:hover {
      background-color: var(--e-global-color-accent);
    }

    /* --- TABLET ---------------------------------------------------------- */
    @media (max-width: 1024px) {
      .jcf-contacto-main {
        display: flex;
        flex-direction: column;
        padding: 60px 32px;
        gap: 32px;
      }
    }

    /* --- MOBILE ---------------------------------------------------------- */
    @media (max-width: 767px) {
      .jcf-contacto-main {
        padding: 60px 24px 30px;
        gap: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="jcf-contacto-page">

    <header class="jcf-header">
      <a href="index.html" class="jcf-header__logo" aria-label="Janela com Ferrugem — Página Inicial">
        <img src="assets/img/Janela com Ferrugem Logo.png" alt="Janela com Ferrugem — Arquitetura com Propósito"
          class="jcf-header__logo-img" width="131" height="71">
      </a>
      <div class="jcf-header__nav-wrapper">
        <button class="jcf-header__menu-toggle" aria-label="Abrir menu" aria-expanded="false" id="menuToggle">
          <span></span>
          <span></span>
        </button>
        <nav class="jcf-menu-dropdown" id="menuDropdown" role="navigation" aria-label="Menu principal">
          <a href="projetos.html" class="jcf-menu-dropdown__link">Projetos</a>
          <a href="objetos.html" class="jcf-menu-dropdown__link">Objetos</a>
          <a href="sobre.html" class="jcf-menu-dropdown__link">Sobre</a>
          <a href="contacto.html" class="jcf-menu-dropdown__link">Contacto</a>

    </header>

    <main class="jcf-contacto-main">

      <div class="jcf-contacto-sidebar">
        <span class="jcf-section-label">CONTACTO</span>

      <div class="jcf-contacto-info">
        <p class="jcf-contacto-info__intro">Tem um projeto em mente?<br>Entre em contacto connosco.</p>
        <div class="jcf-contacto-info__details">
          <a href="mailto:geral@janelacomferrugem.pt"
            class="jcf-contacto-info__detail jcf-contacto-info__detail--link">geral@janelacomferrugem.pt</a>
          <span class="jcf-contacto-info__detail">+351 252 951 626</span>
          <span class="jcf-contacto-info__detail">Rua de Passos 248, 4755-242 Góios</span>
          <a href="https://www.instagram.com/janelacomferrugem" target="_blank" rel="noopener noreferrer"
            class="jcf-contacto-info__detail jcf-contacto-info__detail--link">Instagram</a>
          <a href="https://wa.me/351910758956" target="_blank" rel="noopener" class="jcf-contacto-info__cta" aria-label="Contactar via WhatsApp">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Dúvidas
          </a>
        </div>
      </div>

      <form class="jcf-contacto-form" action="#" method="post" novalidate>
        <div class="jcf-form-field">
          <input type="text" id="field-nome" name="nome" class="jcf-form-field__input" placeholder="Nome"
            autocomplete="name" required>
        </div>
        <div class="jcf-form-field">
          <input type="email" id="field-email" name="email" class="jcf-form-field__input" placeholder="Email"
            autocomplete="email" required>
        </div>
        <div class="jcf-form-field">
          <input type="tel" id="field-telefone" name="telefone" class="jcf-form-field__input" placeholder="Telefone"
            autocomplete="tel">
        </div>
        <div class="jcf-form-field">
          <textarea id="field-mensagem" name="mensagem" class="jcf-form-field__textarea" placeholder="Mensagem"
            rows="4" required></textarea>
        </div>
        <button type="submit" class="jcf-form-submit" id="btn-enviar">Enviar</button>
      </form>

    </main>
  </div>

  <div class="jcf-menu-backdrop" id="menuBackdrop"></div>

  <script>
    (function () {
      const toggle = document.getElementById('menuToggle');
      const dropdown = document.getElementById('menuDropdown');
      const backdrop = document.getElementById('menuBackdrop');
      function openMenu() { dropdown.classList.add('is-active'); backdrop.classList.add('is-active'); toggle.setAttribute('aria-expanded', 'true'); const fl = dropdown.querySelector('a'); if (fl) fl.focus(); }
      function closeMenu() { dropdown.classList.remove('is-active'); backdrop.classList.remove('is-active'); toggle.setAttribute('aria-expanded', 'false'); }
      function toggleMenu() { dropdown.classList.contains('is-active') ? closeMenu() : openMenu(); }
      toggle.addEventListener('click', toggleMenu);
      backdrop.addEventListener('click', closeMenu);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && dropdown.classList.contains('is-active')) { closeMenu(); toggle.focus(); } });
    })();
  </script>
</body>

</html>
